<style>
    @keyframes fadeInFesta { 
        0% { opacity: 0; transform: scale(0.95); } 
        100% { opacity: 1; transform: scale(1); } 
    }
    @keyframes tremor { 
        0%, 90%, 100% { transform: translate(0, 0) rotate(0deg); } 
        92%, 96% { transform: translate(-2px, 2px) rotate(-1deg); } 
        94%, 98% { transform: translate(2px, -2px) rotate(1deg); } 
    }
    .efeito-tremor { animation: tremor 4s infinite; display: inline-block; }
</style>

        <div style="background: #ffffff; padding: clamp(25px, 4vh, 40px) clamp(20px, 4vw, 40px); border-radius: 20px; box-shadow: 0 10px 25px rgba(225, 29, 72, 0.15); border-top: 5px solid #f43f5e; width: 100%; text-align: center;">
