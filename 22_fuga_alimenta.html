<style>
    .caixa-fuga-neon {
        background: linear-gradient(90deg, #f43f5e, #e11d48);
        color: white;
        padding: 20px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(225, 29, 72, 0.4);
        position: relative;
        overflow: hidden;
        margin-top: 25px;
        border: 2px solid #fda4af;
    }
    .caixa-fuga-neon::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 50%; height: 100%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.5), transparent);
        transform: skewX(-20deg);
        animation: brilhoPassando 3s infinite;
    }
    @keyframes brilhoPassando {
        0% { left: -100%; }
        100% { left: 200%; }
    }
    @keyframes piscaNeon {
        0%, 100% { text-shadow: 0 0 10px #e11d48, 0 0 20px #e11d48, 0 0 40px #e11d48; opacity: 1; }
        50% { text-shadow: 0 0 5px #e11d48, 0 0 10px #e11d48; opacity: 0.8; }
    }
</style>
