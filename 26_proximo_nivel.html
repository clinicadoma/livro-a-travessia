<!-- SLIDE: O PRÓXIMO NÍVEL -->
<div class="doma-pagina" id="pag-proximo-nivel" style="background: #f8fafc; width: 100%; height: 100vh; overflow-y: auto; overflow-x: hidden; position: relative;">
    <div class="wrapper-isolado" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px;">
        
        <div style="background: linear-gradient(145deg, #1e293b, #0f172a); padding: 5vh 20px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); border: 1px solid #334155; text-align: center; width: 100%; max-width: 380px; position: relative;">
            <div style="position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; background: rgba(244, 63, 94, 0.4); filter: blur(35px); border-radius: 50%; z-index: 0;"></div>
            
            <div style="font-size: 3.5rem; margin-bottom: 2vh; position: relative; z-index: 1;">🧠</div>
            
            <h3 style="color: #fbbf24; font-family: 'Quicksand', sans-serif; font-size: 1.4rem; font-weight: 900; margin-bottom: 2vh; text-transform: uppercase; position: relative; z-index: 1;">O Próximo Nível</h3>
            
            <p style="color: #e2e8f0; font-size: 1.05rem; line-height: 1.6; margin-bottom: 4vh; font-family: 'Quicksand', sans-serif; font-weight: 500; position: relative; z-index: 1;">Mas como agir quando seus monstros tentam assumir o controle total no seu dia a dia?</p>
            
            <button class="btn-doma pulse-btn" style="background: #334155; color: white; border: 1px solid #475569; padding: 18px; width: 100%; border-radius: 15px; font-weight: 900; font-size: 0.95rem; text-transform: uppercase; box-shadow: 0 8px 20px rgba(0,0,0,0.2); position: relative; z-index: 1;" onclick="abrirCamadaLivro()">Como encontrar o caminho? ➔</button>
        </div>
    </div>
</div>

<!-- SOBREPOSIÇÃO: A INVESTIGAÇÃO DEFINITIVA (CADEADO) -->
<div id="CAMADA_ABSOLUTA_LIVRO" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #ffffff 0%, #f8fafc 100%); z-index: 9999999; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;">
    
    <div style="width: 100%; max-width: 1100px; margin: 0 auto; padding: 15px 10px; position: sticky; top: 0; z-index: 100000; text-align: left; background: linear-gradient(to bottom, #ffffff 80%, rgba(255,255,255,0));">
        <button onclick="fecharCamadaLivro()" style="background: #1e293b; color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-family: 'Quicksand', sans-serif; text-transform: uppercase; font-size: 0.8rem;">
            ⬅️ VOLTAR AOS SLIDES
        </button>
    </div>

    <style>
        #CONTEUDO_LIVRO_INTERNO { display: block; width: 100%; font-family: 'Quicksand', sans-serif; padding: 10px 10px 40px 10px; box-sizing: border-box; color: #1e293b; max-width: 1100px; margin: 0 auto; }
        .livro-topo-texto { text-align: center; transition: opacity 0.5s ease; margin-bottom: 20px; }
        .livro-badge { background: #1e3a8a; color: #facc15; padding: 12px 30px; border-radius: 50px; font-size: 0.95rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; display: inline-block; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(30, 58, 138, 0.25); }
        .livro-layout-flex { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; padding: 40px 20px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; position: relative; width: 100%; transition: all 0.5s ease; }
        .box-acorrentada { position: relative; display: block; margin: 0 auto; width: 100%; max-width: 360px; border-radius: 12px; overflow: hidden; box-shadow: -15px 25px 40px rgba(0,0,0,0.15); transition: transform 0.3s; }
        .box-acorrentada.livre { overflow: visible; box-shadow: none; background: transparent; }
        .livro-img-main { width: 100%; height: auto; display: block; transition: filter 0.5s ease; border-radius: 12px; }
        .overlay-correntes { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; transition: all 0.5s ease; padding: 15px; }
        .corrente-x { position: absolute; font-size: 3rem; letter-spacing: -12px; color: #fff; opacity: 0.8; white-space: nowrap; pointer-events: none; transition: transform 0.5s cubic-bezier(0.55, 0.085, 0.68, 0.53), opacity 0.4s; }
        .c-esq { transform: rotate(45deg) scale(1); }
        .c-dir { transform: rotate(-45deg) scale(1); }
        .cadeado-gigante { font-size: 5.5rem; z-index: 15; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); transition: transform 0.3s, opacity 0.3s; margin-bottom: -10px; }
        .texto-selado { color: #facc15; font-size: 1.1rem; font-weight: 900; margin-top: 15px; text-transform: uppercase; letter-spacing: 2px; z-index: 15; text-shadow: 0 2px 4px #000; transition: opacity 0.3s; text-align: center; }
        .setas-alvo { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; z-index: 20; width: 100%; }
        .seta-neon { color: #facc15; font-size: 1.8rem; animation: piscarSeta 0.8s infinite alternate; text-shadow: 0 0 10px #facc15, 0 0 20px #facc15; }
        @keyframes piscarSeta { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.3; transform: scale(0.9); } }
        .btn-quebrar-azul { background: linear-gradient(45deg, #1d4ed8, #2563eb); color: #fff; border: 2px solid #ffedd5; padding: 15px 40px; border-radius: 50px; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 25px rgba(30, 58, 138, 0.4); transition: 0.3s; display: flex; align-items: center; gap: 10px; z-index: 20; width: 100%; max-width: 320px; justify-content: center; font-family: 'Quicksand', sans-serif; }
        .btn-quebrar-azul:hover { transform: scale(1.05) translateY(-3px); box-shadow: 0 15px 30px rgba(30, 58, 138, 0.6); background: linear-gradient(45deg, #2563eb, #1e40af); }
        @keyframes pulsarSetaParaBotaoD { 0%, 100% { opacity: 1; transform: translateX(0); } 50% { opacity: 0.5; transform: translateX(5px); } }
        @keyframes pulsarSetaParaBotaoE { 0%, 100% { opacity: 1; transform: translateX(0); } 50% { opacity: 0.5; transform: translateX(-5px); } }
        .fumaca-efeito { position: absolute; inset: 0; background: radial-gradient(circle, rgba(200,200,200,0.9) 0%, rgba(255,255,255,0) 70%); filter: blur(20px); opacity: 0; z-index: 25; pointer-events: none; transform: scale(0.5); }
        .fumaca-efeito.ativo { animation: explodirFumaca 1.5s forwards; }
        @keyframes explodirFumaca { 0% { opacity: 0; transform: scale(0.5); } 30% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0; transform: scale(2.5); } }
        .furacao-efeito { position: absolute; font-size: 8rem; opacity: 0; z-index: 22; pointer-events: none; top: 50%; left: 50%; margin-top: -4rem; margin-left: -4rem; }
        .furacao-efeito.ativo { animation: girarFuracao 1s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        @keyframes girarFuracao { 0% { opacity: 0; transform: scale(0.1) rotate(0deg); } 40% { opacity: 1; transform: scale(1.5) rotate(720deg); } 100% { opacity: 0; transform: scale(3) rotate(1440deg); } }
        .flash-luz { position: absolute; inset: 0; background: #ffffff; opacity: 0; z-index: 100; pointer-events: none; border-radius: 12px; }
        .flash-luz.ativo { animation: flashBranco 0.8s forwards; }
        @keyframes flashBranco { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
        .tremer-tela { animation: shakeForte 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeForte { 10%, 90% { transform: translate3d(-4px, 0, 0); } 20%, 80% { transform: translate3d(6px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-10px, 0, 0); } 40%, 60% { transform: translate3d(10px, 0, 0); } }
        @keyframes flutuarLivroLivre { 0%, 100% { transform: translateY(0) rotate(0deg); box-shadow: -15px 25px 40px rgba(0,0,0,0.15); } 50% { transform: translateY(-15px) rotate(2deg); box-shadow: -15px 40px 50px rgba(0,0,0,0.1); } }
        
        .btn-chamar-jornada { display: none; background: #1e3a8a; color: #fff; border: none; padding: 18px 30px; border-radius: 50px; font-size: 1.1rem; font-weight: 900; margin-top: 40px; cursor: pointer; transition: 0.3s; text-transform: uppercase; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(30, 58, 138, 0.4); animation: pulsarBotao 2s infinite; font-family: 'Quicksand', sans-serif; }
        .btn-chamar-jornada:hover { background: #0f172a; transform: scale(1.05); animation: none; }
        @keyframes pulsarBotao { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); box-shadow: 0 15px 40px rgba(30, 58, 138, 0.6); } }
        .confete-livro { position: absolute; width: 12px; height: 12px; z-index: 90; opacity: 0; pointer-events: none; }
    </style>

    <div id="CONTEUDO_LIVRO_INTERNO">
        <audio id="AUDIO_QUEBRA_7" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
        <audio id="AUDIO_APARECER_7" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>

        <div class="livro-container-fix">
            <div class="livro-topo-texto" id="topo-texto-intro">
                <span class="livro-badge" style="background: #ea580c; color: #fff; box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4);">A Investigação Definitiva 🔦</span>
                <p style="color: #475569; font-size: 1.15rem; font-weight: 600; line-height: 1.6;">Respire fundo.</p>
            </div>

            <div class="livro-layout-flex" id="caixa-livro-principal">
                <div class="box-acorrentada" id="box-livro-animado">
                    <img src="https://i.postimg.cc/s2tLZYVR/livro-certo.png" class="livro-img-main" id="img-livro-alvo" alt="Tratamento Selado" style="filter: grayscale(90%) blur(4px) brightness(0.4);">
                    <div class="furacao-efeito" id="ef-furacao">🌪️</div>
                    <div class="fumaca-efeito" id="ef-fumaca"></div>
                    <div class="flash-luz" id="ef-flash"></div>
                    <div class="overlay-correntes" id="overlay-prisao">
                        <span class="corrente-x c-esq" id="corr-1">⛓️⛓️⛓️⛓️⛓️⛓️</span>
                        <span class="corrente-x c-dir" id="corr-2">⛓️⛓️⛓️⛓️⛓️⛓️</span>
                        <div class="cadeado-gigante" id="cadeado-l">🔐</div>
                        <div class="texto-selado" id="txt-selo">CONTEÚDO SELADO</div>
                    </div>
                </div>

                <div class="setas-alvo" id="setas-alvo-id">
                    <span class="seta-neon" style="color: #fbbf24; font-size: 1.5rem; animation: pulsarSetaParaBotaoD 1.5s infinite;">➤</span>
                    <button class="btn-quebrar-azul" id="btn-alicate" onclick="quebrarCorrentesLivro()">
                        <span style="transform: rotate(90deg) scaleX(-1); font-size: 1.3rem;">✂️</span> CORTAR O LACRE
                    </button>
                    <span class="seta-neon" style="color: #fbbf24; font-size: 1.5rem; animation: pulsarSetaParaBotaoE 1.5s infinite;">◄</span>
                </div>

                <button class="btn-chamar-jornada" id="btn-chamar-jornada-id" onclick="fecharCamadaLivro(); mudarPagina(1);">
                    👇 Acessar o Livro
                </button>
            </div>
        </div>

        <script>
            function abrirCamadaLivro() {
                const camada = document.getElementById('CAMADA_ABSOLUTA_LIVRO');
                if (camada) { camada.style.display = 'block'; camada.scrollTop = 0; }
            }
            
            function fecharCamadaLivro() {
                const camada = document.getElementById('CAMADA_ABSOLUTA_LIVRO');
                if (camada) { camada.style.display = 'none'; }
                const aud1 = document.getElementById('AUDIO_QUEBRA_7');
                const aud2 = document.getElementById('AUDIO_APARECER_7');
                if(aud1) { aud1.pause(); aud1.currentTime = 0; }
                if(aud2) { aud2.pause(); aud2.currentTime = 0; }
            }

            function tocarSomFocado(idSom, tempoLimite = 1500) {
                const audio = document.getElementById(idSom);
                if(audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log("Áudio bloqueado."));
                    setTimeout(() => { audio.pause(); }, tempoLimite);
                }
            }

            function quebrarCorrentesLivro() {
                const btnAlicate = document.getElementById('btn-alicate');
                if(btnAlicate.disabled) return;
                btnAlicate.disabled = true;

                document.getElementById('setas-alvo-id').style.display = 'none';
                tocarSomFocado('AUDIO_QUEBRA_7', 1200);
                
                const caixaContainer = document.getElementById('caixa-livro-principal');
                caixaContainer.classList.add('tremer-tela');

                document.getElementById('cadeado-l').style.opacity = '0';
                document.getElementById('txt-selo').style.opacity = '0';
                document.getElementById('corr-1').style.transform = 'rotate(45deg) translate(200px, -200px)';
                document.getElementById('corr-1').style.opacity = '0';
                document.getElementById('corr-2').style.transform = 'rotate(-45deg) translate(200px, 200px)';
                document.getElementById('corr-2').style.opacity = '0';

                setTimeout(() => {
                    document.getElementById('ef-furacao').classList.add('ativo');
                    document.getElementById('ef-fumaca').classList.add('ativo');
                }, 200);

                setTimeout(() => {
                    tocarSomFocado('AUDIO_APARECER_7', 1500); 
                    document.getElementById('ef-flash').classList.add('ativo');
                    document.getElementById('overlay-prisao').style.display = 'none';
                    
                    const imgLivro = document.getElementById('img-livro-alvo');
                    imgLivro.style.filter = 'none';
                    
                    const boxAcorrentada = document.getElementById('box-livro-animado');
                    boxAcorrentada.classList.add('livre');
                    imgLivro.style.animation = 'flutuarLivroLivre 4s ease-in-out infinite';

                    dispararConfetesEspeciais(boxAcorrentada);
                    caixaContainer.classList.remove('tremer-tela');
                    document.getElementById('btn-chamar-jornada-id').style.display = 'block';
                }, 800); 
            }

            function dispararConfetesEspeciais(container) {
                const cores = ['#facc15', '#f97316', '#38bdf8', '#ef4444', '#1e3a8a'];
                for(let i = 0; i < 40; i++) {
                    let confete = document.createElement('div');
                    confete.className = 'confete-livro';
                    if(Math.random() > 0.5) confete.style.borderRadius = '50%';
                    confete.style.background = cores[Math.floor(Math.random() * cores.length)];
                    confete.style.left = '50%'; confete.style.top = '50%';
                    let angulo = Math.random() * Math.PI * 2;
                    let distancia = Math.random() * 200 + 50;
                    let destinoX = Math.cos(angulo) * distancia;
                    let destinoY = Math.sin(angulo) * distancia - 100;
                    confete.animate([
                        { transform: `translate(0px, 0px) scale(0)`, opacity: 1 },
                        { transform: `translate(${destinoX}px, ${destinoY}px) scale(1.5) rotate(360deg)`, opacity: 1, offset: 0.3 },
                        { transform: `translate(${destinoX}px, ${destinoY + 300}px) rotate(720deg)`, opacity: 0 }
                    ], { duration: Math.random() * 1500 + 1500, easing: 'cubic-bezier(.25,.8,.25,1)', fill: 'forwards' });
                    container.appendChild(confete);
                    setTimeout(() => confete.remove(), 3000);
                }
            }
        </script>
    </div>
</div>
